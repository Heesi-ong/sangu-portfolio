    <section class="section page-section" id="about">
      <div class="container about-grid">
        <div data-reveal="left">
          <p class="eyebrow" data-i18n="about.eyebrow">01 / About</p>
          <img class="about-art" src="/about-art.svg" alt="" aria-hidden="true">
        </div>
        <div class="about-copy" data-reveal="right">
          <h1 class="about-lead" data-i18n="about.lead">I care more about solving the right problem than using the newest tool.</h1>
          <p data-i18n="about.p1">I start by understanding what a user is struggling with, then choose the simplest maintainable way to solve it. My goal is code that the next developer can understand without needing an explanation.</p>
          <p data-i18n="about.p2">I work across React and TypeScript on the frontend and Django with PostgreSQL on the backend. I am currently expanding into real-time collaboration with WebSockets, Django Channels, and Redis.</p>
          <div class="principles" data-i18n-aria="about.principlesAria" aria-label="Development principles">
            <div class="principle"><span>01</span><p data-i18n="about.principle1">Content and user intent before decoration.</p></div>
            <div class="principle"><span>02</span><p data-i18n="about.principle2">Small, working releases before premature abstraction.</p></div>
            <div class="principle"><span>03</span><p data-i18n="about.principle3">Evidence and trade-offs before unverified claims.</p></div>
          </div>
        </div>
      </div>
    </section>

  <template id="tpl-project-review-based-content-community">
    <section class="section page-section project-detail">
      <div class="container">
        <a href="/projects" data-route class="project-detail-back">← <span data-i18n="projectDetail.back">Back to projects</span></a>
        <p class="eyebrow" data-i18n="dialog.eyebrow">Case study / In development</p>
        <h1 data-i18n="projects.p1.h3">Review-based content community</h1>
        <p class="dialog-summary" data-i18n="dialog.summary">A full-stack community where people review books, films, and series, discover recommendations through shared taste, and discuss content in real time.</p>
        <img class="project-detail-art" src="/project-art-community.svg" alt="" aria-hidden="true" data-reveal="scale">
        <div class="case-grid" data-reveal>
          <div class="case-item"><span data-i18n="dialog.role.label">Role</span><strong data-i18n="dialog.role.value">Full-Stack Developer</strong></div>
          <div class="case-item"><span data-i18n="dialog.stack.label">Stack</span><strong>Django · React · PostgreSQL</strong></div>
          <div class="case-item"><span data-i18n="dialog.status.label">Status</span><strong data-i18n="projects.p1.status">In development</strong></div>
          <div class="case-item"><span data-i18n="dialog.focus.label">Focus</span><strong data-i18n="dialog.focus.value">Discovery · Realtime conversation</strong></div>
        </div>
        <section class="case-section" data-reveal><h3 data-i18n="dialog.problem.h3">The problem</h3><p data-i18n="dialog.problem.p">Ratings alone do not explain why someone enjoyed a work, while broad recommendation systems often ignore the context behind personal taste.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="dialog.approach.h3">The approach</h3><p data-i18n="dialog.approach.p">Reviews are treated as the primary signal. The product connects structured ratings with written context and enables conversation without separating discovery from discussion.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="dialog.technical.h3">Technical direction</h3><p data-i18n="dialog.technical.p">Django and PostgreSQL own the domain model and API. React delivers the browsing experience, while Django Channels and Redis are being evaluated for connection state and live chat.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="dialog.tradeoff.h3">Current trade-off</h3><p data-i18n="dialog.tradeoff.p">The project prioritizes a reliable review and discovery flow before adding realtime complexity. Live features will only ship after their failure and reconnection states are defined.</p></section>
      </div>
    </section>
  </template>

  <template id="tpl-project-sangu-cloud">
    <section class="section page-section project-detail">
      <div class="container">
        <a href="/projects" data-route class="project-detail-back">← <span data-i18n="projectDetail.back">Back to projects</span></a>
        <p class="eyebrow" data-i18n="cloud.eyebrow">Case study / Live service</p>
        <h1 data-i18n="projects.p2.h3">SangU Cloud</h1>
        <p class="dialog-summary" data-i18n="cloud.summary">A private cloud file manager hosted on a Raspberry Pi and restricted to trusted devices on a Tailscale tailnet.</p>
        <img class="project-detail-art" src="/project-art-cloud.svg" alt="" aria-hidden="true" data-reveal="scale">
        <div class="case-grid" data-reveal>
          <div class="case-item"><span data-i18n="dialog.role.label">Role</span><strong data-i18n="dialog.role.value">Full-Stack Developer</strong></div>
          <div class="case-item"><span data-i18n="dialog.stack.label">Stack</span><strong>Node.js · nginx · Raspberry Pi</strong></div>
          <div class="case-item"><span data-i18n="dialog.status.label">Status</span><strong data-i18n="projects.p2.status">Live</strong></div>
          <div class="case-item"><span data-i18n="dialog.focus.label">Focus</span><strong data-i18n="cloud.focus.value">File management · Deployment</strong></div>
        </div>
        <section class="case-section" data-reveal><h3 data-i18n="cloud.problem.h3">The problem</h3><p data-i18n="cloud.problem.p">I wanted a small cloud service that could run on my own Raspberry Pi, keep files accessible from the browser, and avoid depending on a paid storage platform for basic personal workflows.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="cloud.approach.h3">The approach</h3><p data-i18n="cloud.approach.p">The service keeps the interface focused on upload, folder creation, preview, download, rename, and delete actions. nginx forwards only Tailnet traffic to the Node.js app, while Tailscale provides encrypted access without exposing the service to the public internet.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="cloud.technical.h3">Technical direction</h3><p data-i18n="cloud.technical.p">Node.js handles session-aware file operations, systemd keeps the service running, nginx enforces the Tailnet-only route, and Tailscale provides the private network path.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="cloud.tradeoff.h3">Current trade-off</h3><p data-i18n="cloud.tradeoff.p">The project favors server-owned storage and private access over public sharing convenience. Only approved Tailnet devices can open the running service.</p></section>
        <section class="case-section" data-reveal><h3 data-i18n="cloud.links.h3">Access</h3><p data-i18n="cloud.links.private">The running service is private and available only to approved devices on the Tailnet.</p></section>
      </div>
    </section>
  </template>
