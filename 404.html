<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1ea">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        if ((localStorage.getItem('lang') || (navigator.language || '').toLowerCase().slice(0, 2)) === 'ko') d.setAttribute('lang', 'ko');
      } catch (e) {}
    })();
  </script>
  <title>Not found — SangU</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-field" aria-hidden="true"></div>
  <header class="site-header is-scrolled">
    <div class="shell nav-row"><a class="brand" href="/">SangU<b>.</b></a></div>
  </header>
  <main id="main">
    <section class="section">
      <div class="shell--narrow shell contact-block">
        <p class="eyebrow">404</p>
        <h1 id="h">This page slipped off the grid.</h1>
        <p class="lede" id="p">The link may be old or mistyped. Everything else is still here.</p>
        <a class="btn btn--primary" href="/"><span id="b">Back to start</span><span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
  <script>
    if (document.documentElement.lang === 'ko') {
      document.title = '찾을 수 없음 — SangU';
      document.getElementById('h').textContent = '이 페이지는 그리드에서 벗어났습니다.';
      document.getElementById('p').textContent = '링크가 오래됐거나 잘못 입력됐을 수 있습니다. 나머지는 그대로 있습니다.';
      document.getElementById('b').textContent = '처음으로';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap';
      document.head.appendChild(l);
    }
  </script>
</body>
</html>
