    <section class="section" id="about">

        <div class="about-grid">
          <div class="about-figure glass" data-tilt data-anim="left" id="about-art-slot"></div>
          <div class="about-copy">
            <h2 class="h-xl" data-split data-i18n="about.lead">I care more about solving the right problem than reaching for the newest tool.</h2>
            <p data-anim="fade" data-i18n="about.p1">I start from what a user is actually struggling with, then pick the simplest maintainable way through it. The goal is code the next developer can read without a walkthrough.</p>
            <p data-anim="fade" data-i18n="about.p2">Frontend is React and TypeScript; backend is Django with PostgreSQL. Right now I am extending into realtime collaboration with WebSockets, Django Channels, and Redis.</p>
            <div class="principles">
              <div class="principle glass" data-anim="fade"><span>01</span><p data-i18n="about.pr1">Content and user intent before decoration.</p></div>
              <div class="principle glass" data-anim="fade"><span>02</span><p data-i18n="about.pr2">Small working releases before premature abstraction.</p></div>
              <div class="principle glass" data-anim="fade"><span>03</span><p data-i18n="about.pr3">Evidence and trade-offs before unverified claims.</p></div>
            </div>
          </div>
        </div>

      <div class="shell--narrow shell case case--inline" id="project-community">
        <p class="eyebrow" data-i18n="community.eyebrow">Case study · In development</p>
        <h3 class="case-title" data-split data-i18n="projects.p1.title">Review-based content community</h3>
        <p class="case-summary" data-anim="fade" data-i18n="community.summary">A full-stack community where people review books, films, and series, find recommendations through shared taste, and talk about them in real time.</p>
        <div class="case-hero glass" data-anim="scale" id="community-art-slot"></div>
        <div class="case-facts glass" data-anim="fade">
          <div class="case-fact"><span data-i18n="case.role">Role</span><strong data-i18n="case.roleVal">Full-Stack Developer</strong></div>
          <div class="case-fact"><span data-i18n="case.stack">Stack</span><strong>Django · React · PostgreSQL</strong></div>
          <div class="case-fact"><span data-i18n="case.status">Status</span><strong data-i18n="projects.p1.status">In development</strong></div>
          <div class="case-fact"><span data-i18n="case.focus">Focus</span><strong data-i18n="community.focusVal">Discovery · Realtime</strong></div>
        </div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="community.problemH">The problem</h4><p data-i18n="community.problemP">Ratings alone do not explain why someone liked a work, and broad recommendation systems ignore the context behind personal taste.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="community.approachH">The approach</h4><p data-i18n="community.approachP">Reviews are the primary signal. Structured ratings are tied to written context, and discovery is not separated from discussion.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="community.techH">Technical direction</h4><p data-i18n="community.techP">Django and PostgreSQL own the domain model and API. React delivers browsing; Django Channels and Redis are being evaluated for connection state and live chat.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="community.tradeH">Current trade-off</h4><p data-i18n="community.tradeP">A reliable review and discovery flow ships first. Realtime features land only once their failure and reconnection states are defined.</p></div>
      </div>

      <div class="shell--narrow shell case case--inline" id="project-cloud">
        <p class="eyebrow" data-i18n="cloud.eyebrow">Case study · Live service</p>
        <h3 class="case-title" data-split data-i18n="projects.p2.title">SangU Cloud</h3>
        <p class="case-summary" data-anim="fade" data-i18n="cloud.summary">A private cloud file manager running on a Raspberry Pi, reachable only from trusted devices on a Tailscale tailnet.</p>
        <div class="case-hero glass" data-anim="scale" id="cloud-art-slot"></div>
        <div class="case-facts glass" data-anim="fade">
          <div class="case-fact"><span data-i18n="case.role">Role</span><strong data-i18n="case.roleVal">Full-Stack Developer</strong></div>
          <div class="case-fact"><span data-i18n="case.stack">Stack</span><strong>Node.js · nginx · Raspberry Pi</strong></div>
          <div class="case-fact"><span data-i18n="case.status">Status</span><strong data-i18n="projects.p2.status">Live</strong></div>
          <div class="case-fact"><span data-i18n="case.focus">Focus</span><strong data-i18n="cloud.focusVal">File ops · Deployment</strong></div>
        </div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="cloud.problemH">The problem</h4><p data-i18n="cloud.problemP">I wanted a small cloud service on hardware I own, with files reachable from the browser, without paying a storage platform for basic personal workflows.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="cloud.approachH">The approach</h4><p data-i18n="cloud.approachP">The interface stays focused on upload, folders, preview, download, rename, delete. nginx forwards only tailnet traffic to the Node.js app; Tailscale gives encrypted access without exposing the service publicly.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="cloud.techH">Technical direction</h4><p data-i18n="cloud.techP">Node.js handles session-aware file operations, systemd keeps the service up, nginx enforces the tailnet-only route, and Tailscale provides the private network path.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="cloud.tradeH">Current trade-off</h4><p data-i18n="cloud.tradeP">Server-owned storage and private access over public-sharing convenience. Only approved tailnet devices can open the running service.</p></div>
      </div>

      <div class="shell--narrow shell case case--inline" id="project-teamflow">
        <p class="eyebrow" data-i18n="teamflow.eyebrow">Case study · Live service</p>
        <h3 class="case-title" data-split data-i18n="projects.p3.title">TeamFlow</h3>
        <p class="case-summary" data-anim="fade" data-i18n="teamflow.summary">A team collaboration platform where Kanban tasks, comments, chat, and file uploads share one RBAC-backed workspace, with real-time notifications over SSE and chat over WebSocket.</p>
        <div class="case-hero glass" data-anim="scale" id="teamflow-art-slot"></div>
        <div class="case-facts glass" data-anim="fade">
          <div class="case-fact"><span data-i18n="case.role">Role</span><strong data-i18n="case.roleVal">Full-Stack Developer</strong></div>
          <div class="case-fact"><span data-i18n="case.stack">Stack</span><strong>Spring Boot · React · PostgreSQL</strong></div>
          <div class="case-fact"><span data-i18n="case.status">Status</span><strong data-i18n="projects.p3.status">Live</strong></div>
          <div class="case-fact"><span data-i18n="case.focus">Focus</span><strong data-i18n="teamflow.focusVal">Task management · Realtime</strong></div>
        </div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="teamflow.problemH">The problem</h4><p data-i18n="teamflow.problemP">Team tools for tasks, chat, and files live in different apps, so context gets lost and there is no single place to see who changed what.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="teamflow.approachH">The approach</h4><p data-i18n="teamflow.approachP">One Spring Boot service owns projects, tasks, comments, and activity history behind RBAC, with a Kanban board as the shared surface everyone works from.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="teamflow.techH">Technical direction</h4><p data-i18n="teamflow.techP">Spring Boot and PostgreSQL hold the domain model behind JWT auth; SSE pushes notifications and WebSocket/STOMP drives chat, both backed by Redis for pub/sub and caching.</p></div>
        <div class="case-section" data-anim="fade"><h4 data-i18n="teamflow.tradeH">Current trade-off</h4><p data-i18n="teamflow.tradeP">A single deployable stays easier to operate than splitting services early. Free-tier hosting (Render + Neon + Upstash) means a cold start after 15 minutes of inactivity.</p></div>
      </div>
    </section>
