<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460">
  <style>
    .magnifier { transform-box: fill-box; transform-origin: center; animation: magnifierScan 5.5s ease-in-out infinite; }
    .magnifier-spark { animation: sparkPulse 2.2s ease-in-out infinite; }
    @keyframes magnifierScan {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(-14px, 10px) rotate(-4deg); }
      50% { transform: translate(6px, 22px) rotate(2deg); }
      75% { transform: translate(-6px, 8px) rotate(-2deg); }
    }
    @keyframes sparkPulse {
      0%, 100% { opacity: 1; r: 4.5px; }
      50% { opacity: .35; r: 3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .magnifier, .magnifier-spark { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="aaGlowA" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ead9cf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ead9cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aaGlowB" cx="85%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#b35437" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b35437" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="70" cy="90" r="150" fill="url(#aaGlowA)"/>
  <circle cx="320" cy="410" r="130" fill="url(#aaGlowB)"/>

  <g transform="translate(190,246)">
    <rect x="-118" y="-148" width="236" height="296" rx="18" fill="#faf7f1" stroke="#dcd4c8" stroke-width="1.5"/>

    <rect x="-92" y="-120" width="60" height="60" rx="8" fill="#ead9cf"/>
    <path d="M-92 -84 h60 M-62 -120 v60" stroke="#b35437" stroke-width="1.6" fill="none" opacity="0.55"/>

    <rect x="-16" y="-118" width="108" height="8" rx="4" fill="#33312e" opacity="0.75"/>
    <rect x="-16" y="-100" width="88" height="6" rx="3" fill="#dcd4c8"/>
    <rect x="-16" y="-86" width="96" height="6" rx="3" fill="#dcd4c8"/>

    <rect x="-92" y="-38" width="204" height="7" rx="3.5" fill="#e5ddd0"/>
    <rect x="-92" y="-20" width="176" height="7" rx="3.5" fill="#e5ddd0"/>
    <rect x="-92" y="-2" width="190" height="7" rx="3.5" fill="#e5ddd0"/>
    <rect x="-92" y="16" width="120" height="7" rx="3.5" fill="#e5ddd0"/>

    <rect x="-92" y="46" width="66" height="22" rx="11" fill="#eee7dc" stroke="#dcd4c8" stroke-width="1.2"/>
    <rect x="-16" y="46" width="66" height="22" rx="11" fill="#eee7dc" stroke="#dcd4c8" stroke-width="1.2"/>
    <rect x="60" y="46" width="52" height="22" rx="11" fill="#eee7dc" stroke="#dcd4c8" stroke-width="1.2"/>
  </g>

  <g class="magnifier" transform="translate(150,124)">
    <circle r="54" fill="#faf7f1" fill-opacity="0.55" stroke="#b35437" stroke-width="7"/>
    <line x1="38" y1="38" x2="76" y2="76" stroke="#883b27" stroke-width="10" stroke-linecap="round"/>
    <circle r="4.5" class="magnifier-spark" fill="#a94f32"/>
  </g>
</svg>
